<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 PLUS - Salle XR interactive (mini-projet)</title>
<!-- Version figée : A-Frame 1.7.1 (reproductibilité) -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js"></script>
<style>
  #hud { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 10; pointer-events: none;
         font: 600 15px system-ui, sans-serif; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; }
  #barre { position: fixed; top: 8px; right: 8px; z-index: 11; display: flex; gap: 6px; }
  #barre button { font: 600 15px system-ui, sans-serif; border: 0; border-radius: 10px; padding: 9px 14px;
         background: #1b2a41; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  #barre button:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="barre">
  <button id="btnAide">? Aide</button>
  <button id="btnRejouer">Rejouer</button>
</div>
<div id="hud">Visez avec le point blanc, touchez l'écran pour agir.</div>

<a-scene id="scene" vr-mode-ui="enabled: false" renderer="antialias: true">

  <!-- ============ BLOC 1 : ENVIRONNEMENT ============ -->
  <a-entity id="Environnement">
    <a-sky color="#9ec9ee"></a-sky>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

    <a-plane id="Sol" class="interactif" teleport-sol rotation="-90 0 0" width="6" height="6"
             material="color: #c9c9c9; roughness: 0.9"></a-plane>

    <a-plane position="0 1.5 -3" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="3 1.5 0" rotation="0 -90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" material="color: #e8eef5"></a-plane>

    <!-- Table A : instruments (plateau à 0,75 m) -->
    <a-entity id="Table_A" position="-0.65 0 -1">
      <a-box position="0 0.725 0" width="1.2" height="0.05" depth="0.6" material="color: #8d6e63; roughness: 0.8"></a-box>
      <a-box position="-0.55 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="0.55 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="-0.55 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="0.55 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    </a-entity>

    <!-- Table B : 4 zones de dépôt -->
    <a-entity id="Table_B" position="0.65 0 -1">
      <a-box position="0 0.725 0" width="1.2" height="0.05" depth="0.6" material="color: #eceff1; roughness: 0.5"></a-box>
      <a-box position="-0.55 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="0.55 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="-0.55 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="0.55 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    </a-entity>

    <!-- Panneau de mission (textes 3D sans accents : la police A-Frame ne les a pas) -->
    <a-plane position="0 2.0 -2.95" width="2.4" height="0.9" material="color: #1b2a41; shader: flat"></a-plane>
    <a-text id="Panneau" position="0 2.0 -2.93" width="2.2" align="center" color="#ffffff"
            value="Salle de formation\nPlacez chaque instrument\ndans sa zone."></a-text>
    <a-text position="0 2.55 -2.93" width="2.2" align="center" color="#ffd54f"
            value="Prototype pedagogique - pas un dispositif medical"></a-text>
  </a-entity>

  <!-- ============ BLOC 2 : ZONES DE DÉPÔT ============ -->
  <a-entity id="Zones">
    <a-cylinder id="zone_bistouri" class="interactif" zone-depot position="0.2 0.755 -1"  radius="0.09" height="0.01" color="#ef9a9a"></a-cylinder>
    <a-cylinder id="zone_pince"    class="interactif" zone-depot position="0.5 0.755 -1"  radius="0.09" height="0.01" color="#90caf9"></a-cylinder>
    <a-cylinder id="zone_ecarteur" class="interactif" zone-depot position="0.8 0.755 -1"  radius="0.09" height="0.01" color="#a5d6a7"></a-cylinder>
    <a-cylinder id="zone_ciseaux"  class="interactif" zone-depot position="1.1 0.755 -1"  radius="0.09" height="0.01" color="#ce93d8"></a-cylinder>
    <a-text position="0.2 0.9 -1" width="0.7" align="center" value="Bistouri"></a-text>
    <a-text position="0.5 0.9 -1" width="0.7" align="center" value="Pince"></a-text>
    <a-text position="0.8 0.9 -1" width="0.7" align="center" value="Ecarteur"></a-text>
    <a-text position="1.1 0.9 -1" width="0.7" align="center" value="Ciseaux"></a-text>
  </a-entity>

  <!-- ============ BLOC 3 : INSTRUMENTS (son et vibration propres à chacun) ============ -->
  <a-entity id="Instruments">
    <a-box id="bistouri" class="interactif" instrument="nom: Bistouri; zone: zone_bistouri; freq: 520; vib: 30"
           position="-1.1 0.82 -1" width="0.22" height="0.08" depth="0.08"
           material="color: #e53935; metalness: 0.3; roughness: 0.4"></a-box>
    <a-cylinder id="pince" class="interactif" instrument="nom: Pince; zone: zone_pince; freq: 640; vib: 50"
           position="-0.8 0.84 -1" rotation="0 0 90" radius="0.05" height="0.2"
           material="color: #1e88e5; metalness: 0.3; roughness: 0.4"></a-cylinder>
    <a-cone id="ecarteur" class="interactif" instrument="nom: Ecarteur; zone: zone_ecarteur; freq: 760; vib: 70"
           position="-0.5 0.83 -1" radius-bottom="0.07" radius-top="0" height="0.15"
           material="color: #43a047; metalness: 0.3; roughness: 0.4"></a-cone>
    <!-- 4e instrument : ciseaux = anneau violet de 12 cm -->
    <a-torus id="ciseaux" class="interactif" instrument="nom: Ciseaux; zone: zone_ciseaux; freq: 880; vib: 90"
           position="-0.2 0.8 -1" rotation="-90 0 0" radius="0.05" radius-tubular="0.01"
           segments-radial="8" segments-tubular="24"
           material="color: #8e24aa; metalness: 0.3; roughness: 0.4"></a-torus>
  </a-entity>

  <!-- ============ BLOC 4 : XR ORIGIN (rig) + caméra + curseur ============ -->
  <a-entity id="rig" position="0 0 0.8" wasd-controls="acceleration: 15">
    <a-entity id="tete" camera position="0 1.6 0" look-controls>
      <a-entity id="curseur" cursor="fuse: false" raycaster="objects: .interactif; far: 8"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
                material="color: #ffffff; shader: flat; opacity: 0.9"></a-entity>
    </a-entity>
  </a-entity>

  <!-- Panneau de résultat (bonus d) : placé à 1,2 m devant l'utilisateur à la fin -->
  <a-entity id="Resultat" visible="false">
    <a-plane width="1.1" height="0.7" material="color: #1565c0; shader: flat; opacity: 0.95"></a-plane>
    <a-text id="ResultatTexte" position="0 0.08 0.01" width="1.0" align="center" color="#ffffff" value=""></a-text>
    <a-plane id="BoutonRejouer" position="0 -0.24 0.01" width="0.4" height="0.12"
             material="color: #ffffff; shader: flat"></a-plane>
    <a-text position="0 -0.24 0.02" width="0.8" align="center" color="#1565c0" value="Rejouer"></a-text>
  </a-entity>
</a-scene>

<script>
const THREE = AFRAME.THREE;
const params = new URLSearchParams(location.search);
const DIFFICILE = params.has('difficile');            // bonus e : ?difficile

/* ---------- Son et vibration ---------- */
let ctxAudio = null;
function bip(freq = 660, duree = 0.12) {
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(); o.stop(ctxAudio.currentTime + duree);
  } catch (e) { /* pas de son : on continue */ }
}
function vibrer(motif) { if (navigator.vibrate) navigator.vibrate(motif); }   // Android seulement

/* ---------- État du jeu ---------- */
const jeu = { main: null, score: 0, erreurs: 0, aides: 0, t0: null, fini: false, total: 0 };
const hud = document.getElementById('hud');
function majPanneau(msg) {
  document.getElementById('Panneau').setAttribute('text', 'value',
    'Score : ' + jeu.score + ' / ' + jeu.total + '   Erreurs : ' + jeu.erreurs + '\n' + msg);
  hud.textContent = (jeu.main ? 'En main : ' + jeu.main.components.instrument.data.nom + ' - touchez sa zone'
                              : 'Touchez un instrument pour le saisir')
                    + ' | Score ' + jeu.score + '/' + jeu.total + ' Erreurs ' + jeu.erreurs
                    + (DIFFICILE ? ' | Mode difficile' : '');
}

/* ---------- Téléportation ---------- */
AFRAME.registerComponent('teleport-sol', {
  init() {
    this.el.addEventListener('click', e => {
      if (!e.detail.intersection || jeu.fini) return;
      const p = e.detail.intersection.point;
      const x = Math.max(-2.4, Math.min(2.4, p.x)), z = Math.max(-2.4, Math.min(2.4, p.z));
      document.getElementById('rig').object3D.position.set(x, 0, z);
      bip(440, 0.08);
    });
  }
});

/* ---------- Instrument : libre -> survole -> saisi -> (libre | depose) ---------- */
AFRAME.registerComponent('instrument', {
  schema: { nom: { type: 'string' }, zone: { type: 'string' },
            freq: { type: 'number', default: 520 }, vib: { type: 'number', default: 30 } },
  init() {
    jeu.total++;                                        // bonus a : le total est compté, pas écrit
    this.etat = 'libre';
    this.posInit = this.el.object3D.position.clone();
    this.rotInit = this.el.object3D.rotation.clone();
    this.el.addEventListener('mouseenter', () => { if (this.etat === 'libre') this.setEtat('survole'); });
    this.el.addEventListener('mouseleave', () => { if (this.etat === 'survole') this.setEtat('libre'); });
    this.el.addEventListener('click', () => {
      if (this.etat === 'depose' || jeu.fini) return;
      if (this.etat === 'saisi') this.relacher();
      else if (!jeu.main) this.saisir();
    });
  },
  setEtat(e) {
    this.etat = e;
    const brille = e === 'survole' && !DIFFICILE;       // bonus e : pas de surbrillance
    this.el.setAttribute('material', 'emissive', brille ? '#ffee58' : '#000000');
    this.el.setAttribute('material', 'emissiveIntensity', brille ? 0.6 : 0);
  },
  saisir() {
    if (!jeu.t0) jeu.t0 = performance.now();
    document.getElementById('tete').object3D.attach(this.el.object3D);
    this.el.object3D.position.set(0.22, -0.22, -0.7);
    this.el.object3D.rotation.set(0, 0, 0);
    this.el.classList.remove('interactif');
    jeu.main = this.el;
    this.setEtat('saisi');
    bip(this.data.freq); vibrer(this.data.vib);         // bonus b : son et vibration propres
    majPanneau('Vous tenez : ' + this.data.nom);
  },
  relacher(silence) {
    document.getElementById('scene').object3D.attach(this.el.object3D);
    this.el.object3D.position.copy(this.posInit);
    this.el.object3D.rotation.copy(this.rotInit);
    this.el.classList.add('interactif');
    jeu.main = null;
    this.setEtat('libre');
    if (!silence) { bip(this.data.freq * 0.6, 0.1); majPanneau('Instrument repose.'); }
  },
  deposer(zoneEl) {
    const p = new THREE.Vector3();
    zoneEl.object3D.getWorldPosition(p);
    document.getElementById('scene').object3D.attach(this.el.object3D);
    this.el.object3D.position.set(p.x, p.y + 0.06, p.z);
    this.el.object3D.rotation.set(0, 0, 0);
    jeu.main = null;
    this.setEtat('depose');
  }
});

/* ---------- Zone de dépôt (règle métier) ---------- */
AFRAME.registerComponent('zone-depot', {
  init() {
    this.couleur = this.el.getAttribute('color');
    this.ok = false;
    this.el.addEventListener('click', () => {
      if (!jeu.main || jeu.fini) return;
      const inst = jeu.main.components.instrument;
      if (inst.data.zone === this.el.id) {
        inst.deposer(this.el);
        jeu.score++;
        this.ok = true;
        bip(inst.data.freq * 1.5, 0.2); vibrer([40, 60, 40]);
        this.el.setAttribute('material', 'color', '#2e7d32');
        if (jeu.score === jeu.total) terminer(); else majPanneau('Bien joue !');
      } else {
        jeu.erreurs++;
        bip(180, 0.3); vibrer([100, 50, 100]);
        this.el.setAttribute('material', 'color', '#d32f2f');
        setTimeout(() => this.el.setAttribute('material', 'color', this.ok ? '#2e7d32' : this.couleur), 500);
        inst.relacher(true);
        majPanneau('Mauvaise zone. Reessayez.');
      }
    });
  }
});

/* ---------- Bonus c : bouton Aide (la bonne zone clignote 2 s) ---------- */
const btnAide = document.getElementById('btnAide');
if (DIFFICILE) btnAide.disabled = true;
btnAide.onclick = () => {
  if (DIFFICILE || jeu.fini) return;
  const cible = jeu.main || [...document.querySelectorAll('[instrument]')]
                  .find(el => el.components.instrument.etat !== 'depose');
  if (!cible) return;
  const zone = document.getElementById(cible.components.instrument.data.zone);
  const zc = zone.components['zone-depot'];
  jeu.aides++;
  bip(990, 0.1);
  let n = 0;
  const t = setInterval(() => {
    zone.setAttribute('material', 'color', n % 2 === 0 ? '#ffeb3b' : zc.couleur);
    if (++n >= 4) { clearInterval(t); zone.setAttribute('material', 'color', zc.ok ? '#2e7d32' : zc.couleur); }
  }, 500);
  majPanneau('Aide : regardez la zone qui clignote.');
};

/* ---------- Bonus d : panneau de résultat devant l'utilisateur ---------- */
function terminer() {
  jeu.fini = true;
  const s = ((performance.now() - jeu.t0) / 1000).toFixed(0);
  majPanneau('TERMINE en ' + s + ' s');
  document.getElementById('ResultatTexte').setAttribute('value',
    'Mission terminee !\n\nTemps : ' + s + ' s\nErreurs : ' + jeu.erreurs + '\nAides : ' + jeu.aides
    + (DIFFICILE ? '\n(mode difficile)' : ''));
  // 1,2 m devant le regard, à hauteur des yeux
  const tete = document.getElementById('tete').object3D;
  const pos = new THREE.Vector3(), dir = new THREE.Vector3();
  tete.getWorldPosition(pos); tete.getWorldDirection(dir);     // pour une caméra, dir pointe vers l'arrière
  dir.y = 0; dir.normalize().multiplyScalar(-1.2);
  const res = document.getElementById('Resultat');
  res.object3D.position.set(pos.x + dir.x, pos.y, pos.z + dir.z);
  res.object3D.lookAt(pos.x, pos.y, pos.z);
  res.setAttribute('visible', true);
  document.getElementById('BoutonRejouer').classList.add('interactif');
  document.getElementById('curseur').components.raycaster.refreshObjects();
  bip(660, 0.15); setTimeout(() => bip(880, 0.15), 160); setTimeout(() => bip(1100, 0.3), 330);
  vibrer([60, 40, 60, 40, 120]);
  console.log('RESULTAT', JSON.stringify({ secondes: +s, erreurs: jeu.erreurs, aides: jeu.aides, difficile: DIFFICILE }));
}
document.getElementById('BoutonRejouer').addEventListener('click', () => location.reload());
document.getElementById('btnRejouer').onclick = () => location.reload();

/* ---------- Mesures : ?stats, ?stress=N, &seg=8 ---------- */
const sceneEl = document.getElementById('scene');
if (params.has('stats')) sceneEl.setAttribute('stats', '');
const nbStress = parseInt(params.get('stress') || '0', 10);
const seg = parseInt(params.get('seg') || '32', 10);
for (let i = 0; i < nbStress; i++) {
  const s = document.createElement('a-sphere');
  s.setAttribute('radius', 0.08);
  s.setAttribute('segments-width', seg);
  s.setAttribute('segments-height', seg);
  s.setAttribute('position', { x: (Math.random() - 0.5) * 5, y: 0.3 + Math.random() * 2.5, z: (Math.random() - 0.5) * 5 });
  s.setAttribute('material', 'color: #9575cd; metalness: 0.5; roughness: 0.3');
  sceneEl.appendChild(s);
}

sceneEl.addEventListener('loaded', () => majPanneau(DIFFICILE ? 'Mode difficile : sans aide.' : 'Saisissez un instrument.'));
</script>
</body>
</html>
